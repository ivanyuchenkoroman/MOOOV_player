[project]
name = "mooov-player"
version = "1.1.0"
description = "Simple fast viewer for video files and image sequences (EXR, PNG, JPG, TIFF...)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "OpenEXR>=3.3",
    "opencolorio>=2.3",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
